# ローカル開発用。既定でDBと単一SPA/APIコンテナを起動する。
# ホットリロード開発では `docker compose up -d db` とhostのNodeを使う。
name: future-roi-local

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: futureroi
      POSTGRES_USER: futureroi
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in the current shell or .env}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U futureroi -d futureroi"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  app:
    build: .
    # initがSIGTERMをNodeへ転送し、serverのhandler登録前のmigration待機も中断できる。
    init: true
    # 起動時DDLはローカルComposeの経路に限定する。公開環境のmigration jobは別途レビュー。
    command: ["node", "apps/api/dist/container-start.js"]
    environment:
      # passwordはURIに埋め込まない（`%`・`#`・`?`等がURI解析で別の値になる）。pgはURIにpasswordがなければ
      # PGPASSWORDをそのまま使うため、dbへ渡したrawの値と常に一致する。
      DATABASE_URL: postgres://futureroi@db:5432/futureroi
      PGPASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in the current shell or .env}
      # 自動生成・固定値にせず、再起動後も同じローカル専用Secretをユーザーが設定する。
      # 空値はappの起動時に拒否する（dbだけのhost開発ではSecretを要求しない）。
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # このComposeはloopback専用。公開HTTPS環境にはHTTP許可を持ち込まない。
      BETTER_AUTH_URL: http://127.0.0.1:${LOCAL_APP_PORT:-8080}
      BETTER_AUTH_ALLOW_HTTP: "1"
      AUTH_TRUSTED_ORIGINS: http://localhost:${LOCAL_APP_PORT:-8080}
      # ローカルComposeは外部へメールを送らず、パスワード再設定のリンクをappのログへ出す（docker compose logs app）。
      MAIL_TRANSPORT: log
    ports:
      - "127.0.0.1:${LOCAL_APP_PORT:-8080}:8080"
    # APIの終了猶予10秒より長くし、poolを閉じる前にSIGKILLしない。
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
