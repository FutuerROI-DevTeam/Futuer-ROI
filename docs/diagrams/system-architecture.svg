<svg xmlns="http://www.w3.org/2000/svg" width="480" height="860" viewBox="0 0 480 860" role="img" aria-labelledby="system-architecture-title" data-source-sha256="03be7bc65fda79db0e6928bfcbd051efb520bc673986f00d0970585abf72c960">
<title id="system-architecture-title">ローカル Docker の構成</title>
<desc>Future ROI main の説明図。編集元は同名 draw.io ファイル。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526976"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fafcfd"/>
<g font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif">
<rect data-cell-id="container" x="82" y="244" width="378" height="354" rx="12" fill="#fff4e9" stroke="#9aaab3"/>
<polyline data-cell-id="http-edge" points="270,188 270,244" fill="none" stroke="#526976" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-cell-id="engine-edge" points="270,400 270,476" fill="none" stroke="#526976" stroke-width="2" marker-end="url(#arrow)"/>
<polyline data-cell-id="db-edge" points="100,350 42,350 42,721 100,721" fill="none" stroke="#526976" stroke-width="2" marker-end="url(#arrow)"/>
<g data-cell-id="title"><rect x="20" y="12" width="440" height="40" rx="12" fill="none" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="240" y="32">ローカル Docker の構成</tspan>
</text>
</g>
<g data-cell-id="browser"><rect x="100" y="76" width="340" height="112" rx="12" fill="#eef5fb" stroke="#9aaab3"/>
<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="104">ブラウザ</tspan>
<tspan x="270" y="132">React + Vite</tspan>
<tspan x="270" y="160">Router / Query</tspan>
</text>
</g>
<g data-cell-id="container-title"><rect x="90" y="250" width="360" height="32" rx="12" fill="none" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="266">app：単一 Node コンテナ</tspan>
</text>
</g>
<g data-cell-id="api"><rect x="100" y="300" width="340" height="100" rx="12" fill="#ffffff" stroke="#9aaab3"/>
<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="322">Fastify API / SPA 配信</tspan>
<tspan x="270" y="350">Better Auth / 所有者確認</tspan>
<tspan x="270" y="378">入出力検証 / pg</tspan>
</text>
</g>
<g data-cell-id="engine"><rect x="100" y="476" width="340" height="96" rx="12" fill="#e9f4ed" stroke="#9aaab3"/>
<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="496">Prediction Engine</tspan>
<tspan x="270" y="524">純粋 TypeScript・同期計算</tspan>
<tspan x="270" y="552">HTTP / DB / 時計を読まない</tspan>
</text>
</g>
<g data-cell-id="db"><rect x="100" y="666" width="340" height="110" rx="12" fill="#eef5fb" stroke="#9aaab3"/>
<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="693">PostgreSQL 18</tspan>
<tspan x="270" y="721">Goal / 日々の記録 / 回答</tspan>
<tspan x="270" y="749">認証・session / volume保存</tspan>
</text>
</g>
<g data-cell-id="http"><rect x="20" y="204" width="440" height="30" rx="12" fill="#fafcfd" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="240" y="219">同一 origin の /api と SPA</tspan>
</text>
</g>
<g data-cell-id="sync"><rect x="100" y="424" width="340" height="30" rx="12" fill="#fff4e9" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="270" y="439">同期呼出し → 結果をAPIへ</tspan>
</text>
</g>
<g data-cell-id="db-note"><rect x="20" y="614" width="440" height="40" rx="12" fill="none" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="240" y="634">DB I/O は API が担当</tspan>
</text>
</g>
<g data-cell-id="scope"><rect x="20" y="804" width="440" height="40" rx="12" fill="none" stroke="none"/>
<text text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" font-family="Yu Gothic, Meiryo, Noto Sans JP, sans-serif" fill="#20323b">
<tspan x="240" y="824">公開候補の Vercel / Neon は別計画</tspan>
</text>
</g>
</g>
</svg>
