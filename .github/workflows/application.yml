name: Application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Node 24.21.0 は package.json engines・mise.toml・Dockerfile と同じ版。
  NODE_VERSION: '24.21.0'
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  vercel-bundle:
    name: Production install and Vercel bundle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install with the actual Vercel configuration
        run: >-
          node --input-type=module -e
          "import config from './vercel.json' with { type: 'json' };
          import { execSync } from 'node:child_process';
          execSync(config.installCommand, { stdio: 'inherit' });"
      - name: Build the self-contained Function without secrets or a database
        run: npm run build:vercel
      - name: Verify structure and source copy boundaries without full HTTP asset probing
        run: node --test --test-name-pattern='^(配備構造|コピー前|欠落asset)' scripts/tests/vercel-bundle.test.mjs

  application:
    name: Install, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: futureroi
          POSTGRES_USER: futureroi
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futureroi -d futureroi"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: node .github/scripts/ci-report.mjs run install -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Test CI diagnostics
        run: node .github/scripts/ci-report.mjs run diagnostic-tests -- node --test .github/scripts/ci-report.test.mjs
      - name: Show versions
        run: |
          node --version
          npm --version
      - name: Typecheck
        run: node .github/scripts/ci-report.mjs run typecheck -- npm run typecheck
      - name: Test
        # APIテストはCIのPostgreSQL serviceへ接続する（CI専用の合成password。Secretではない）。
        env:
          DATABASE_URL: postgres://futureroi:ci-only-placeholder@127.0.0.1:5432/futureroi
        run: node .github/scripts/ci-report.mjs run test -- npm test
      - name: Build
        run: node .github/scripts/ci-report.mjs run build -- npm run build
      - name: Test filesystem migration result checks
        run: node .github/scripts/ci-report.mjs run migration-tests -- node --test scripts/tests/check-migrations.test.mjs
      - name: Run db:migrate on the empty service database, then again (must be a no-op)
        env:
          DATABASE_URL: postgres://futureroi:ci-only-placeholder@127.0.0.1:5432/futureroi
        run: node .github/scripts/ci-report.mjs run migrate -- bash .github/scripts/check-migrations.sh
      - name: Summarize verification
        if: ${{ always() }}
        run: node .github/scripts/ci-report.mjs summary application
      - name: Retain safe failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-report/*.json
            ${{ runner.temp }}/ci-report/*.log
          if-no-files-found: warn
          retention-days: 1

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_DB: futureroi
          POSTGRES_USER: futureroi
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futureroi -d futureroi"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate compose file
        env:
          LOCAL_DB_PASSWORD: ci-only-placeholder
        run: node .github/scripts/ci-report.mjs run compose-config -- docker compose config --quiet
      - name: Verify Compose smoke midnight retry and missing-secret isolation
        run: node .github/scripts/ci-report.mjs run smoke-script-tests -- bash .github/scripts/smoke-script-tests.sh
      - name: Build the single SPA/API container
        run: node .github/scripts/ci-report.mjs run container-build -- docker build --tag future-roi:${{ github.run_id }}-${{ github.run_attempt }} .
      - name: Start, probe routes and stop with SIGTERM
        env:
          IMAGE: future-roi:${{ github.run_id }}-${{ github.run_attempt }}
          DATABASE_URL: postgres://futureroi:ci-only-placeholder@127.0.0.1:5432/futureroi
        run: node .github/scripts/ci-report.mjs run container-smoke -- ./scripts/smoke-container.sh
      - name: Verify default Compose startup, restart, failure gates and volume retention
        run: node .github/scripts/ci-report.mjs run compose-smoke -- ./scripts/smoke-compose.sh
      - name: Summarize verification
        if: ${{ always() }}
        run: node .github/scripts/ci-report.mjs summary container
      - name: Retain safe failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-report/*.json
            ${{ runner.temp }}/ci-report/*.log
          if-no-files-found: warn
          retention-days: 1
