name: Deploy production

# Issue #275: mainのApplication / Foundationが同じSHAで全job成功した後にだけ、Vercel本番へ配備する。
# 起動はCIの完了イベントだが、配備対象はロック取得後のmainの先頭（古いSHAのイベントでも最新mainを扱う）。
# 採用理由・代替案・手動での停止と戻し方は docs/operations/release-guide.md の「12. 自動配備（CD）」を参照。
on:
  workflow_run:
    workflows: [Application, Foundation]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# 本番配備は常に1つずつ。実行中のものは中断せず、待機は最新の1件だけ残る。
# 待機が古いSHAのイベントに置き換わっても、gateがその時点のmain先頭を対象にするため最新mainを取りこぼさない。
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '24.21.0'
  VERCEL_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    name: CI result for the current main head
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      deploy: ${{ steps.gate.outputs.deploy }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Decide whether the current main head may be deployed
        id: gate
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-gate.mjs gate
      - name: Summarize
        env:
          SHA: ${{ steps.gate.outputs.sha }}
          DEPLOY: ${{ steps.gate.outputs.deploy }}
          REASON: ${{ steps.gate.outputs.reason }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "- main \`$SHA\`（起動イベント \`$EVENT_SHA\`）: deploy=$DEPLOY ($REASON)" >> "$GITHUB_STEP_SUMMARY"

  schema:
    name: Production schema check (read only)
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      schema: ${{ steps.classify.outputs.schema }}
    env:
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: db:check against production
        id: check
        env:
          SCHEMA_CHECK_TIMEOUT_MS: '30000'
          SCHEMA_CHECK_QUERY_TIMEOUT_MS: '5000'
        run: |
          set +e
          bash .github/scripts/with-production-db.sh npm run --silent db:check > "$RUNNER_TEMP/schema.txt"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/schema.txt"
      - name: Classify
        id: classify
        env:
          CHECK_EXIT: ${{ steps.check.outputs.exit }}
        run: node .github/scripts/deploy-gate.mjs schema "$RUNNER_TEMP/schema.txt" "$CHECK_EXIT"
      - name: Stop on unexpected schema state
        if: steps.classify.outputs.schema == 'stop'
        run: |
          echo "- schema: stop。本番DBが想定外の状態です。release-guide 12-D に従い人が確認してください。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  migrate:
    name: Production migration (approval required)
    needs: [gate, schema]
    if: needs.schema.outputs.schema == 'pending'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # production-migration Environmentの承認者が、旧版との互換性（release-guide 工程10）を確認してから承認する。
    environment: production-migration
    env:
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Record the restore point
        run: echo "- migration開始 $(date -u +%Y-%m-%dT%H:%M:%SZ)（Neonの履歴復元で戻す場合の基準時刻）" >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure the SHA is still main head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-gate.mjs head
      - name: db:migrate
        run: bash .github/scripts/with-production-db.sh npm run --silent db:migrate
      - name: db:check must be ok after migration
        env:
          SCHEMA_CHECK_TIMEOUT_MS: '30000'
          SCHEMA_CHECK_QUERY_TIMEOUT_MS: '5000'
        run: bash .github/scripts/with-production-db.sh npm run --silent db:check

  deploy:
    name: Build, verify and promote
    needs: [gate, schema, migrate]
    # migrateのskipは許すが、Cancelは尊重する（always()だと取消後もpromoteへ進み得る。PR #276 review P2）。
    if: >-
      !cancelled()
      && needs.gate.outputs.deploy == 'true'
      && (needs.schema.outputs.schema == 'ok' || needs.migrate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Skip if production already runs this SHA
        id: current
        timeout-minutes: 2
        run: |
          host="${PRODUCTION_URL#https://}"
          curl -fsS --connect-timeout 5 --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" > "$RUNNER_TEMP/current.json"
          echo "previous=$(node -e "console.log(require(process.argv[1]).id)" "$RUNNER_TEMP/current.json")" >> "$GITHUB_OUTPUT"
          if node .github/scripts/deploy-gate.mjs deployment "$RUNNER_TEMP/current.json" >/dev/null; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "- 本番は既に \`$TARGET_SHA\` です。配備しません。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure the SHA is still main head
        if: steps.current.outputs.same == 'false'
        run: node .github/scripts/deploy-gate.mjs head
      - name: Build a production deployment without assigning the domain
        id: build
        if: steps.current.outputs.same == 'false'
        timeout-minutes: 12
        run: |
          url="$(npx --yes vercel@63.1.2 deploy --prod --skip-domain --yes --meta "cdSha=$TARGET_SHA" --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "- 候補: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the candidate is this SHA
        id: candidate
        if: steps.current.outputs.same == 'false'
        timeout-minutes: 2
        env:
          CANDIDATE_URL: ${{ steps.build.outputs.url }}
        run: |
          host="${CANDIDATE_URL#https://}"
          curl -fsS --connect-timeout 5 --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" > "$RUNNER_TEMP/candidate.json"
          node .github/scripts/deploy-gate.mjs deployment "$RUNNER_TEMP/candidate.json"
          echo "id=$(node -e "console.log(require(process.argv[1]).id)" "$RUNNER_TEMP/candidate.json")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the candidate
        if: steps.current.outputs.same == 'false'
        timeout-minutes: 4
        env:
          CANDIDATE_URL: ${{ steps.build.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash .github/scripts/smoke-deployment.sh "$CANDIDATE_URL"
      - name: Ensure the SHA is still main head before promote
        if: steps.current.outputs.same == 'false'
        run: node .github/scripts/deploy-gate.mjs head
      # ここから先は本番URLが変わり得る。試行を記録し、CLIの成否に関係なく実aliasで照合・復旧する（review P1）。
      - name: Mark the promote attempt
        id: attempt
        if: steps.current.outputs.same == 'false'
        run: echo "promote=true" >> "$GITHUB_OUTPUT"
      - name: Promote to production
        if: steps.attempt.outputs.promote == 'true'
        continue-on-error: true
        timeout-minutes: 4
        env:
          CANDIDATE_URL: ${{ steps.build.outputs.url }}
        run: npx --yes vercel@63.1.2 promote "$CANDIDATE_URL" --yes --timeout 3m --token "$VERCEL_TOKEN"
      - name: Reconcile production and roll back on failure
        # Cancel後もpromote開始後なら必ず照合・復旧する。
        if: always() && steps.attempt.outputs.promote == 'true'
        timeout-minutes: 10
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.id }}
          PREVIOUS_ID: ${{ steps.current.outputs.previous }}
        run: bash .github/scripts/reconcile-production.sh "$CANDIDATE_ID" "$PREVIOUS_ID"
